name: TRC deploy checks

# Additive and TRC-only. Validates deploy/trc/ with no server contact and no
# secrets, so it is safe on any branch and on pull requests.

on:
  push:
    # `dev` is listed so this gate keeps running once chore/new-ci merges --
    # with only the feature branch here it would stop firing at exactly the
    # point the assets become the deployed ones.
    branches: [dev, chore/new-ci]
    paths:
      - 'deploy/trc/**'
      - '.github/workflows/trc-*.yml'
      # The ROOT Dockerfile, which no TRC asset would otherwise mention. It is
      # here because deploy/trc/Dockerfile is a COPY of it plus the TRC deltas,
      # and validate_compose.py pins its hash to catch the two drifting apart.
      # A fork sync from open-webui touches ONLY this path, so without it the
      # one event the pin exists to catch would not run the pin.
      - 'Dockerfile'
  pull_request:
    paths:
      - 'deploy/trc/**'
      - '.github/workflows/trc-*.yml'
      # The ROOT Dockerfile, which no TRC asset would otherwise mention. It is
      # here because deploy/trc/Dockerfile is a COPY of it plus the TRC deltas,
      # and validate_compose.py pins its hash to catch the two drifting apart.
      # A fork sync from open-webui touches ONLY this path, so without it the
      # one event the pin exists to catch would not run the pin.
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trc-deploy-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate TRC staging deploy assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install 'pyyaml==6.0.3'

      # ubuntu-latest ships the docker CLI and compose plugin, which the
      # validator needs for `docker compose config`.
      - name: Run contract checks
        run: python deploy/trc/validate_compose.py
