name: TRC publish image
run-name: Publish trc-open-webui (${{ github.ref_name }}) to GHCR

# Additive and TRC-only. Exists so chore/new-ci carries publishing on its own
# and chore/ci can be obsoleted, without editing docker.yaml. Scope is narrow on
# purpose: linux/amd64, one image, a moving branch tag plus a sha tag. It does
# not replicate docker.yaml's multi-variant, multi-arch matrix or its
# push-by-digest merge job -- the TRC deploy consumes only this one image.

on:
  push:
    branches: [dev, chore/new-ci]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: trc-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/nature-technologies/trc-open-webui

jobs:
  publish:
    name: Build and push trc-open-webui
    if: github.repository == 'Nature-Technologies/trc-open-webui'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        run: |
          set -eu
          # Branch ref as a moving tag, slashes flattened, plus an immutable
          # sha tag so any published build can still be named exactly.
          ref="${GITHUB_REF_NAME//\//-}"
          printf 'moving=%s:%s\n' "$IMAGE_NAME" "$ref" >> "$GITHUB_OUTPUT"
          printf 'sha=%s:sha-%s\n' "$IMAGE_NAME" "${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.moving }}
            ${{ steps.tags.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=trc-publish-amd64
          cache-to: type=gha,mode=max,scope=trc-publish-amd64
