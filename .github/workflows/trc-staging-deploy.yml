name: TRC staging deploy (open-webui)
run-name: Deploy open-webui to Dev/Test Server

# Additive and TRC-only. Builds AND deploys in one run.
#
# The BUILD RUNS ON THE DEPLOY HOST, via the job-level DOCKER_HOST below --
# same arrangement as trc-backend's and trc-hermes-agent's deploys. buildx's
# default container driver starts with an empty cache every dispatch, which
# made every deploy a cold 15-45 min build; the host's daemon holds the only
# layer cache that persists. Only the source context crosses the network,
# never an image.
#
# There is no registry: `push: false` puts the image straight into the deploy
# host's image store, which is the daemon `docker compose up -d` talks to. The
# compose service sets `pull_policy: never` so a missing image fails closed
# instead of reaching out to GHCR, where the retired publish-then-pull scheme
# left tags that a rollback dispatch could otherwise silently start.
#
# ROLLBACK IS HOST-LOCAL. `:git-<7-char-sha>` tags exist only in that host's
# image store -- a `docker image prune -a` or a host rebuild destroys every
# rollback target. See docs/deploy/trc-staging.md before pruning there.
#
# Runs on a SELF-HOSTED runner: the staging host is internal and unreachable
# from a GitHub-hosted runner.
#
# Never `docker context create`/`use` here: this runner is shared with sibling
# repos (trc-hermes-agent, paperclip) and `use` would repoint the DEFAULT
# daemon for their jobs too, and would fail "already exists" on the second run
# besides. The job-level DOCKER_HOST is scoped to this job and cannot leak.
#
# Other consequences worth knowing:
#   - no env file is written anywhere. The Deploy step binds the secrets as its
#     own `env:`, and Compose resolves the compose file's ${...} references from
#     that process environment -- so no secret touches disk on the runner or the
#     server, and nothing is dotenv-parsed, which means a `$`, backtick or `#`
#     in a value is taken literally instead of interpolated or truncated. The
#     charset guard the retired `.env.staging` rendering needed is gone with it;
#     the length guard on HERMES_API_KEY is not, being about the gateway rather
#     than about parsing
#   - there is no `docker login` any more, so nothing here mutates the shared
#     ~/.docker/config.json, and the per-job DOCKER_CONFIG that used to isolate
#     it -- along with the `docker logout` that made it necessary -- is gone too
#   - this repo has no bind mount, so nothing needs to be copied onto the host
#     for compose to start. Only the JWT fingerprint goes to the server, over
#     plain scp, never through DOCKER_HOST
#   - there is NO cleanup step, matching trc-hermes-agent. The private key
#     lives only under $RUNNER_TEMP, which the runner clears at the start of
#     each job, so it cannot collide with a sibling repo's concurrent deploy.
#     The per-job ssh-agent, however, is left RUNNING: it holds the decrypted
#     key in memory on this persistent runner until the machine reboots, one
#     more agent per dispatch. Reap them with `pkill ssh-agent` on the runner
#     if that accumulation matters
#   - ~/.ssh/known_hosts is genuinely shared across sibling jobs on this
#     runner. The merge below is non-destructive, so the worst case is a
#     redundant rescan; see docs/deploy/trc-staging.md for the
#     one-job-at-a-time / separate-users requirement that covers it

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: >-
          Create trc-shared and trc-staging-open-webui-data instead of failing
          when they are missing, and log loudly that it did. Use only when
          standing up a fresh host; leave false on every routine deploy.
        type: boolean
        default: false

# No `packages: write`: nothing is pushed to GHCR any more.
permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  # Still spelled as a GHCR reference even though nothing is pushed there: it
  # is now only a local tag name in the deploy host's image store, and keeping
  # the spelling means run logs and rollback tags read the same as they did
  # under the retired publish-then-pull scheme.
  IMAGE: ghcr.io/nature-technologies/trc-open-webui
  COMPOSE_FILE_PATH: deploy/trc/docker-compose-staging-trc.yml

jobs:
  deploy:
    name: Build and deploy open-webui to staging
    if: github.repository == 'Nature-Technologies/trc-open-webui'
    runs-on: self-hosted
    environment: staging
    timeout-minutes: 45
    env:
      # Job-wide ON PURPOSE: the BUILD runs on the deploy server, not just the
      # deploy. Every docker command below therefore talks to that daemon over
      # SSH -- which is why the SSH key step must come first, before anything
      # that shells out to docker.
      DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_PORT || '22' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write SSH key and scan the host key
        env:
          SSH_PRIVATE_KEY_DEV: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          # Never `set -x` in any step here: it would print secrets into the log.
          if [ -z "$SSH_PRIVATE_KEY_DEV" ]; then
            echo "::error::SSH_PRIVATE_KEY_DEV is empty"; exit 1
          fi
          if [ -z "$HOST" ]; then
            echo "::error::HOST is empty"; exit 1
          fi

          # The key lives ONLY under $RUNNER_TEMP -- never ~/.ssh/id_rsa -- and
          # is loaded into a per-job ssh-agent. This runner is PERSISTENT and
          # shared with sibling repos' deploys, which can run concurrently on
          # the same $HOME: a shared ~/.ssh/id_rsa would let one job's cleanup
          # delete the key a sibling job is mid-deploy with. The agent's socket
          # is exported via $GITHUB_ENV so every later step in THIS job inherits
          # it, which authenticates both the explicit ssh/scp calls below
          # (passed -i explicitly too, since that costs nothing and does not
          # depend on default-identity resolution) and -- load-bearing here --
          # the ssh the Docker CLI spawns internally for DOCKER_HOST, which
          # every docker call in this job now goes through, including the build.
          install -m 600 -D /dev/null "$RUNNER_TEMP/id_rsa"
          printf '%s\n' "$SSH_PRIVATE_KEY_DEV" > "$RUNNER_TEMP/id_rsa"
          eval "$(ssh-agent -a "$RUNNER_TEMP/ssh-agent.sock")" >/dev/null
          ssh-add "$RUNNER_TEMP/id_rsa" >/dev/null
          {
            echo "SSH_AUTH_SOCK=$RUNNER_TEMP/ssh-agent.sock"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

          # Trust-on-first-use; StrictHostKeyChecking stays ON, so a key that
          # changes mid-run still aborts. keyscan exits 0 even when nothing
          # answered, so the `test -s` is the real reachability check -- and it
          # must fail now, not 45 minutes into the build.
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$HOST" > "$RUNNER_TEMP/known_hosts"
          test -s "$RUNNER_TEMP/known_hosts"
          install -m 700 -d ~/.ssh
          touch ~/.ssh/known_hosts
          # Drop stale entries for both spellings (keyscan writes a bare host
          # for port 22, `[host]:port` otherwise), then append. Never truncate
          # with `>` or an unadorned `tee`: ~/.ssh/known_hosts persists between
          # jobs on this runner, so the entries already there are not ours.
          ssh-keygen -R "$HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true
          ssh-keygen -R "[${HOST}]:${SSH_PORT}" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true
          cat "$RUNNER_TEMP/known_hosts" >> ~/.ssh/known_hosts

      - name: Compute image tags
        id: tags
        run: |
          set -eu
          printf 'staging=%s:staging\n' "$IMAGE" >> "$GITHUB_OUTPUT"
          printf 'sha=%s:git-%s\n' "$IMAGE" "${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Before the build, like the host preconditions below: a secret this
      # short cannot produce a working deploy, and finding that out after a
      # cold build wastes the whole run.
      - name: Verify the shared gateway key
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        run: |
          set -eu
          # Kept from the retired `.env.staging` rendering; the charset guard
          # that sat next to it is not, because nothing dotenv-parses these
          # values any more. This one is about the GATEWAY, not about parsing:
          # below 16 characters Hermes refuses to start its API server at all,
          # so the symptom is connection-refused on :8642, not a 401.
          if [ "${#HERMES_API_KEY}" -lt 16 ]; then
            echo "::error::HERMES_API_KEY must be at least 16 characters, matching trc-hermes-agent's copy. Below that the gateway refuses to start the API server at all, so the symptom is connection-refused on :8642, not a 401."
            exit 1
          fi
          echo "HERMES_API_KEY length OK"

      # Runs BEFORE the build: the build happens on this host, so free disk and
      # a reachable daemon are preconditions of the build itself. A full disk
      # must fail in seconds, not 28 minutes in.
      - name: Verify host preconditions
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          # A workflow_dispatch boolean renders as exactly `true` or `false`.
          # Read through an env: binding and validated here rather than spliced
          # as `${{ inputs.bootstrap }}` straight into the shell text below: the
          # same form is used in every step of all three repos' deploys, so
          # there is one place to reason about and no expression interpolation
          # inside a test.
          case "$BOOTSTRAP" in
            true|false) ;;
            *)
              echo "::error::bootstrap must be true or false, got '$BOOTSTRAP'"
              exit 1 ;;
          esac

          # Proves the SSH transport and the remote daemon before anything else.
          docker version --format 'remote daemon {{.Server.Version}}'

          # BuildKit's out-of-space failures name everything except the cause.
          # Thresholds match trc-backend's and trc-hermes-agent's deploys.
          avail=$(ssh -o BatchMode=yes -i "$RUNNER_TEMP/id_rsa" -p "$SSH_PORT" \
            "${USERNAME}@${HOST}" \
            'df --output=avail -B1 /var/lib/docker 2>/dev/null | tail -1') || avail=""
          case "$avail" in
            ''|*[!0-9]*)
              echo "::warning::Could not read free space on the deploy host - check df -h manually." ;;
            *)
              gb=$((avail / 1000000000))
              if [ "$avail" -lt 10000000000 ]; then
                echo "::error::Only ${gb} GB free on the deploy host. A cold build needs more than that and fails obscurely when it runs out. See docs/deploy/trc-staging.md for what is safe to prune - note that pruning images also destroys rollback targets."
                exit 1
              elif [ "$avail" -lt 25000000000 ]; then
                echo "::warning::${gb} GB free on the deploy host - enough for a cached build, tight for a cold one."
              else
                echo "OK - ${gb} GB free on the deploy host."
              fi ;;
          esac

          # Fail closed on the external volume, UNLESS bootstrapping a fresh
          # host: Compose refuses to start when an external volume is missing,
          # and that is the guard. Creating it on a routine deploy would boot
          # open-webui against a silently EMPTY volume -- no chats, no users,
          # no settings -- with every smoke test below still passing. Worse
          # here than elsewhere: open-webui is published on 0.0.0.0:3000 with
          # signup enabled, so an empty data volume means the first visitor
          # becomes admin.
          if docker volume inspect trc-staging-open-webui-data >/dev/null 2>&1; then
            :
          elif [ "$BOOTSTRAP" = "true" ]; then
            echo "::warning::bootstrap=true -- creating trc-staging-open-webui-data. It will be EMPTY. Only intended for standing up a fresh host."
            docker volume create trc-staging-open-webui-data
          else
            echo "::error::external volume trc-staging-open-webui-data does not exist on the host. This deploy will not create it silently -- create and populate it (see docs/deploy/trc-staging.md), or re-dispatch with bootstrap: true on a genuinely fresh host."
            exit 1
          fi

          # trc-shared belongs to the trc-backend stack; this deploy never
          # creates it, unless bootstrapping a fresh host. `|| true` because a
          # concurrent bootstrap from a sibling repo can win the race, and
          # "already exists" is the desired end state anyway. stderr is
          # deliberately NOT suppressed here, unlike poc-net's create -- a
          # genuine failure on a bootstrap path should stay visible in the log.
          if docker network inspect trc-shared >/dev/null 2>&1; then
            :
          elif [ "$BOOTSTRAP" = "true" ]; then
            echo "::warning::bootstrap=true -- creating trc-shared on this host."
            docker network create trc-shared || true
          else
            echo "::error::external network trc-shared does not exist on the host. It is owned by the trc-backend stack -- re-dispatch with bootstrap: true only on a genuinely fresh host."
            exit 1
          fi

          # poc-net carries no data, so creating it is always safe and idempotent.
          docker network create poc-net 2>/dev/null || true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          # The remote daemon's OWN builder, reached through the job-level
          # DOCKER_HOST. The default container driver would start empty on
          # every dispatch, which is the failure this whole arrangement exists
          # to avoid.
          driver: docker

      - name: Build the image on the deploy server
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          # No registry: built straight into the deploy host's image store,
          # which is the same daemon `docker compose up -d` talks to below.
          push: false
          tags: |
            ${{ steps.tags.outputs.staging }}
            ${{ steps.tags.outputs.sha }}
          # A label, never a build-arg. The obvious build-arg here would be
          # BUILD_HASH, but it is consumed in the FRONTEND stage as
          # APP_BUILD_HASH, so passing the sha would invalidate the npm build
          # layer on every single commit -- defeating the host-side layer cache
          # this whole arrangement exists to exploit. Labels are image config,
          # not a layer, so this records the commit for free.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          # No `platforms`: build native to the server, or buildx silently
          # switches on QEMU emulation. No cache-from/to: the daemon's own
          # layer store is the cache now, and the docker driver cannot use the
          # gha cache backend anyway. No attestations: they force a manifest
          # list and an extra export pass for nothing.
          provenance: false

      - name: Publish the shared-key fingerprint
        env:
          OPENWEBUI_JWT_SECRET: ${{ secrets.OPENWEBUI_JWT_SECRET }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          # Twelve hex characters of a SHA-256 over the JWT secret. Not a
          # secret and not brute-forceable; it lets trc-backend detect that its
          # IDENTITY_JWT_SECRET has drifted from this repo's copy. Goes over
          # plain scp, not through DOCKER_HOST -- it is a file on the host
          # filesystem, not anything the daemon knows about.
          printf '%s' "$OPENWEBUI_JWT_SECRET" | sha256sum | cut -c1-12 > openwebui.fpr
          ssh -i "$RUNNER_TEMP/id_rsa" -p "$SSH_PORT" "${USERNAME}@${HOST}" \
            'mkdir -p /srv/trc/staging/fingerprints'
          scp -i "$RUNNER_TEMP/id_rsa" -P "$SSH_PORT" openwebui.fpr \
            "${USERNAME}@${HOST}:/srv/trc/staging/fingerprints/openwebui-jwt"

      - name: Deploy
        # Compose resolves the compose file's ${...} references from THIS
        # process environment. No env file is written, on the runner or the
        # server, so no secret ever touches disk -- and because nothing is
        # parsed as dotenv, values are taken literally: a `$`, backtick or `#`
        # in a secret survives instead of being interpolated or truncated.
        #
        # Every variable the compose file references must be listed here, since
        # there is no other source for them; deploy/trc/validate_compose.py
        # asserts exactly that.
        env:
          # The IMMUTABLE tag this run built, not the moving `:staging`
          # pointer -- so the deploy runs exactly what this run built and "what
          # is running" is unambiguous. To roll back, hardcode an older
          # `:git-<7>` tag here on a throwaway branch, but only one still in
          # the host's image store: these tags are HOST-LOCAL now and a
          # `docker image prune -a` there destroys every rollback target. See
          # docs/deploy/trc-staging.md.
          OPENWEBUI_IMAGE: ${{ steps.tags.outputs.sha }}
          OPENWEBUI_BIND: 0.0.0.0
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          OPENWEBUI_JWT_SECRET: ${{ secrets.OPENWEBUI_JWT_SECRET }}
        run: |
          set -eu
          echo "deploying $OPENWEBUI_IMAGE"
          # No `pull`: the build above already put the image in THIS daemon's
          # store, and the compose service sets `pull_policy: never` so a
          # missing image fails closed instead of reaching for GHCR.
          # No `--env-file`: see the note above.
          docker compose -f "$COMPOSE_FILE_PATH" up -d --remove-orphans
          # Best-effort record of what landed. There is no digest to print any
          # more -- RepoDigests is only ever set for an image that went through
          # a registry -- so the local image id is the record, and it must
          # never fail an otherwise-successful deploy.
          if img="$(docker inspect --format '{{.Image}}' open-webui 2>/dev/null)"; then
            echo "deployed image id: $img"
          else
            echo "could not inspect open-webui for a record (non-fatal)"
          fi

      - name: Smoke test
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          ok=0
          for _ in $(seq 1 30); do
            if docker exec -i open-webui python3 - <<'PY'
          import sys, urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=10)
          except Exception as exc:
              print(f"open-webui not ready: {exc}")
              sys.exit(1)
          print("open-webui OK")
          PY
            then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::open-webui never answered on :8080/health"
            docker logs --tail 50 open-webui || true
            exit 1
          fi

          # THE shared-secret detector. This runs INSIDE the container so it
          # reads that container's own OPENAI_API_KEY -- the only way to prove
          # this repo's HERMES_API_KEY secret matches trc-hermes-agent's copy.
          # A mismatch fails the deploy instead of shipping a broken chat path.
          docker exec -i open-webui python3 - <<'PY'
          import os, sys, urllib.error, urllib.request
          key = os.environ.get("OPENAI_API_KEY", "")
          if not key:
              print("OPENAI_API_KEY is empty inside the container")
              sys.exit(1)
          req = urllib.request.Request(
              "http://hermes-agent:8642/v1/models",
              headers={"Authorization": f"Bearer {key}"},
          )
          try:
              urllib.request.urlopen(req, timeout=15)
          except urllib.error.HTTPError as exc:
              if exc.code in (401, 403):
                  print(
                      f"HTTP {exc.code} from the gateway: this repo's "
                      "HERMES_API_KEY does not match trc-hermes-agent's copy"
                  )
              else:
                  print(f"gateway returned HTTP {exc.code}")
              sys.exit(1)
          except Exception as exc:
              print(f"could not reach hermes-agent:8642 over poc-net: {exc}")
              sys.exit(1)
          print("gateway reachable and the shared HERMES_API_KEY matches")
          PY

          # Two-repo JWT secret. Warn only: this depends on trc-backend writing
          # its side, so it must never fail a deploy. Reads files on the host
          # filesystem, so this comparison stays on SSH rather than DOCKER_HOST.
          ours=$(ssh -i "$RUNNER_TEMP/id_rsa" -p "$SSH_PORT" "${USERNAME}@${HOST}" \
            'cat /srv/trc/staging/fingerprints/openwebui-jwt 2>/dev/null' || true)
          theirs=$(ssh -i "$RUNNER_TEMP/id_rsa" -p "$SSH_PORT" "${USERNAME}@${HOST}" \
            'cat /srv/trc/staging/fingerprints/backend-identity-jwt 2>/dev/null' || true)
          if [ -z "$theirs" ]; then
            echo "::warning::no trc-backend fingerprint at /srv/trc/staging/fingerprints/backend-identity-jwt -- OPENWEBUI_JWT_SECRET vs IDENTITY_JWT_SECRET is unverified. A mismatch shows up as identity-verified requests failing while ordinary chat works."
          elif [ "$ours" != "$theirs" ]; then
            echo "::warning::OPENWEBUI_JWT_SECRET does not match trc-backend's IDENTITY_JWT_SECRET. Identity-verified requests will be rejected by the backend while ordinary chat keeps working."
          else
            echo "JWT secret matches trc-backend"
          fi
