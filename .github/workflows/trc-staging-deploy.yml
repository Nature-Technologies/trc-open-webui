name: TRC staging deploy (open-webui)
run-name: Deploy open-webui to Dev/Test Server

# Additive and TRC-only. Does NOT build: trc-publish.yml publishes the image and
# this rolls the configured moving tag onto the staging host.
#
# Runs `docker compose` from the runner against the host's Docker daemon over an
# SSH context. Two consequences worth knowing:
#   - the rendered .env is read by the LOCAL compose CLI and never lands on the
#     server; values reach the containers as environment, not as a file on disk
#   - this repo has no bind mount, so nothing else needs to reach the server
#     except the JWT fingerprint (see "Publish the shared-key fingerprint")

on:
  workflow_dispatch:

permissions:
  contents: read
  # Lets the runner authenticate to GHCR itself (see the "Log in to GHCR"
  # step) -- packages are public today, but this makes a private package work
  # too, with no new secret.
  packages: read

concurrency:
  group: trc-staging-deploy
  cancel-in-progress: false

env:
  # The moving tag this deploy tracks, published by trc-publish.yml. Change this
  # one line to follow a different branch tag.
  IMAGE_TAG: dev
  IMAGE_REPO: ghcr.io/nature-technologies/trc-open-webui
  COMPOSE_FILE_PATH: deploy/trc/docker-compose-staging-trc.yml

jobs:
  deploy:
    name: Deploy open-webui to staging
    if: github.repository == 'Nature-Technologies/trc-open-webui'
    runs-on: ubuntu-latest
    environment: Staging
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Write SSH key and scan the host key
        env:
          SSH_PRIVATE_KEY_DEV: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
        run: |
          set -eu
          # Never `set -x` in any step here: it would print secrets into the log.
          if [ -z "$SSH_PRIVATE_KEY_DEV" ]; then
            echo "::error::SSH_PRIVATE_KEY_DEV is empty"; exit 1
          fi
          if [ -z "$HOST" ]; then
            echo "::error::HOST is empty"; exit 1
          fi
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          printf '%s\n' "$SSH_PRIVATE_KEY_DEV" > ~/.ssh/id_rsa
          # Trust-on-first-use: the host key is taken from the host at deploy
          # time rather than pinned. StrictHostKeyChecking stays ON, so a key
          # that changes mid-run still aborts.
          ssh-keyscan -p "$SSH_PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan returned nothing for $HOST — host unreachable or SSH closed"
            exit 1
          fi

      - name: Set up the remote Docker context
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
        run: |
          set -eu
          # SSH_PORT here must match the port ssh-keyscan used above, or
          # known_hosts describes a different endpoint than the one this
          # context actually dials.
          docker context create trc-staging \
            --docker "host=ssh://${USERNAME}@${HOST}:${SSH_PORT}"
          docker context use trc-staging
          # Proves the SSH transport and the remote daemon before anything else.
          docker version --format 'remote daemon {{.Server.Version}}'

      - name: Verify host preconditions
        run: |
          set -eu
          # Fail closed on the external volume. Compose refuses to start when an
          # external volume is missing, and that is the guard: creating it here
          # would boot open-webui against a silently EMPTY volume -- no chats,
          # no users, no settings -- and every smoke test below would still
          # pass. Worse here than elsewhere: open-webui is published on
          # 0.0.0.0:3000 with signup enabled, so an empty data volume lets the
          # first visitor become admin. It is created and populated during the
          # Phase 2 migration.
          if ! docker volume inspect trc-staging-open-webui-data >/dev/null 2>&1; then
            echo "::error::external volume trc-staging-open-webui-data does not exist on the host. Create and populate it during the Phase 2 migration; this deploy will not create it."
            exit 1
          fi
          # trc-shared belongs to the trc-backend stack; this deploy never
          # creates it.
          if ! docker network inspect trc-shared >/dev/null 2>&1; then
            echo "::error::external network trc-shared does not exist on the host. It is owned by the trc-backend stack."
            exit 1
          fi
          # poc-net carries no data, so creating it is safe and idempotent.
          docker network create poc-net 2>/dev/null || true

      - name: Render the environment file
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          OPENWEBUI_JWT_SECRET: ${{ secrets.OPENWEBUI_JWT_SECRET }}
        run: |
          set -eu
          # This file stays on the runner. The local compose CLI reads it and
          # sends the values to the remote daemon as container environment, so
          # no plaintext secret is ever written to the staging host.

          if [ "${#HERMES_API_KEY}" -lt 16 ]; then
            echo "::error::HERMES_API_KEY must be at least 16 characters, matching trc-hermes-agent's copy. Below that the gateway refuses to start the API server at all, so the symptom is connection-refused on :8642, not a 401."
            exit 1
          fi
          for name in HERMES_API_KEY OPENWEBUI_JWT_SECRET; do
            eval "value=\${$name}"
            case "$value" in
              *'$'*|*'`'*|*'#'*)
                echo "::error::$name contains \$, a backtick or #, which Compose mangles when interpolating the env file"
                exit 1 ;;
            esac
          done

          umask 077
          {
            printf 'OPENWEBUI_IMAGE=%s:%s\n' "$IMAGE_REPO" "$IMAGE_TAG"
            printf 'HERMES_API_KEY=%s\n' "$HERMES_API_KEY"
            printf 'OPENWEBUI_JWT_SECRET=%s\n' "$OPENWEBUI_JWT_SECRET"
            printf 'OPENWEBUI_BIND=0.0.0.0\n'
          } > .env.staging

      - name: Publish the shared-key fingerprint
        env:
          OPENWEBUI_JWT_SECRET: ${{ secrets.OPENWEBUI_JWT_SECRET }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
        run: |
          set -eu
          # Twelve hex characters of a SHA-256 over the JWT secret. Not a
          # secret and not brute-forceable; it lets trc-backend detect that its
          # IDENTITY_JWT_SECRET has drifted from this repo's copy.
          printf '%s' "$OPENWEBUI_JWT_SECRET" | sha256sum | cut -c1-12 > openwebui.fpr
          ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" "${USERNAME}@${HOST}" \
            'mkdir -p /srv/trc/staging/fingerprints'
          scp -i ~/.ssh/id_rsa -P "$SSH_PORT" openwebui.fpr \
            "${USERNAME}@${HOST}:/srv/trc/staging/fingerprints/openwebui-jwt"
          rm -f openwebui.fpr

      - name: Log in to GHCR
        # Over a remote Docker context, `docker compose pull` sends THIS
        # runner's registry credentials to the remote daemon (X-Registry-Auth)
        # -- the staging host never needs, and never gets, any credential of
        # its own. Logging in here, not on the host, is what replaces the old
        # host-side `docker login` + GHCR_READ_TOKEN secret; it works whether
        # the package is public or private.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and deploy
        run: |
          set -eu
          echo "deploying ${IMAGE_REPO}:${IMAGE_TAG}"
          docker compose --env-file .env.staging -f "$COMPOSE_FILE_PATH" pull
          docker compose --env-file .env.staging -f "$COMPOSE_FILE_PATH" up -d --remove-orphans
          # Record what actually landed, so a rollback has a named target. Read
          # from the IMAGE, not the container: a container's inspect output has
          # no RepoDigests key at all. Guarded: a digest record is best-effort
          # and must never fail an otherwise-successful deploy.
          if img="$(docker inspect --format '{{.Image}}' open-webui 2>/dev/null)"; then
            echo "deployed digest:"
            docker image inspect "$img" \
              --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}(no digest){{end}}'
          else
            echo "could not inspect open-webui for a digest record (non-fatal)"
          fi

      - name: Smoke test
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
        run: |
          set -eu
          ok=0
          for _ in $(seq 1 30); do
            if docker exec -i open-webui python3 - <<'PY'
          import sys, urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=10)
          except Exception as exc:
              print(f"open-webui not ready: {exc}")
              sys.exit(1)
          print("open-webui OK")
          PY
            then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::open-webui never answered on :8080/health"
            docker logs --tail 50 open-webui || true
            exit 1
          fi

          # THE shared-secret detector. This runs INSIDE the container so it
          # reads that container's own OPENAI_API_KEY -- the only way to prove
          # this repo's HERMES_API_KEY secret matches trc-hermes-agent's copy.
          # A mismatch fails the deploy instead of shipping a broken chat path.
          docker exec -i open-webui python3 - <<'PY'
          import os, sys, urllib.error, urllib.request
          key = os.environ.get("OPENAI_API_KEY", "")
          if not key:
              print("OPENAI_API_KEY is empty inside the container")
              sys.exit(1)
          req = urllib.request.Request(
              "http://hermes-agent:8642/v1/models",
              headers={"Authorization": f"Bearer {key}"},
          )
          try:
              urllib.request.urlopen(req, timeout=15)
          except urllib.error.HTTPError as exc:
              if exc.code in (401, 403):
                  print(
                      f"HTTP {exc.code} from the gateway: this repo's "
                      "HERMES_API_KEY does not match trc-hermes-agent's copy"
                  )
              else:
                  print(f"gateway returned HTTP {exc.code}")
              sys.exit(1)
          except Exception as exc:
              print(f"could not reach hermes-agent:8642 over poc-net: {exc}")
              sys.exit(1)
          print("gateway reachable and the shared HERMES_API_KEY matches")
          PY

          # Two-repo JWT secret. Warn only: this depends on trc-backend writing
          # its side, so it must never fail a deploy. Reads files on the host
          # filesystem, so this comparison stays on SSH rather than the Docker
          # context.
          ours=$(ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" "${USERNAME}@${HOST}" \
            'cat /srv/trc/staging/fingerprints/openwebui-jwt 2>/dev/null' || true)
          theirs=$(ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" "${USERNAME}@${HOST}" \
            'cat /srv/trc/staging/fingerprints/backend-identity-jwt 2>/dev/null' || true)
          if [ -z "$theirs" ]; then
            echo "::warning::no trc-backend fingerprint at /srv/trc/staging/fingerprints/backend-identity-jwt -- OPENWEBUI_JWT_SECRET vs IDENTITY_JWT_SECRET is unverified. A mismatch shows up as identity-verified requests failing while ordinary chat works."
          elif [ "$ours" != "$theirs" ]; then
            echo "::warning::OPENWEBUI_JWT_SECRET does not match trc-backend's IDENTITY_JWT_SECRET. Identity-verified requests will be rejected by the backend while ordinary chat keeps working."
          else
            echo "JWT secret matches trc-backend"
          fi

      - name: Remove the deploy context
        if: always()
        run: |
          set -eu
          # .env.staging is the only secret this workflow ever writes to disk
          # on the runner (never on the host). Clean it up even on failure.
          rm -f .env.staging
          docker context use default || true
          docker context rm trc-staging || true
