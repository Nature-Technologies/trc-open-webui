# TRC staging deploy for open-webui. Additive and TRC-only -- no upstream
# tooling reads this file, and it is deliberately named differently from the
# root docker-compose*.yaml files so upstream merges cannot conflict.
# See docs/deploy/trc-staging.md.
name: trc-staging-open-webui

networks:
  # External: shared with the hermes-agent and paperclip compose projects, so
  # none of them can own creation. `trc-shared` belongs to whoever runs the
  # trc-backend stack and carries the redaction-filter calls to
  # http://app:8000/redaction/*.
  poc-net:
    external: true
  trc-shared:
    external: true

volumes:
  # All Open WebUI chats, users and settings. External so a project rename can
  # never silently swap in an empty volume.
  trc-staging-open-webui-data:
    external: true

services:
  open-webui:
    image: ${OPENWEBUI_IMAGE:?OPENWEBUI_IMAGE must be set}
    container_name: open-webui
    # The deploy BUILDS this image on the host's own daemon and never pushes it
    # to a registry, so there is nothing to pull. Compose's default policy
    # (`missing`) would pull when the tag is absent locally, which is wrong in
    # two ways here: on a routine deploy it would hide a build that never
    # landed behind a GHCR round trip, and on a rollback dispatch naming an
    # older `:git-<7>` tag it could start whatever GHCR still has under that
    # tag instead of the copy in this host's store. `never` fails closed.
    pull_policy: never
    networks: [poc-net, trc-shared]
    restart: unless-stopped
    # No depends_on: hermes-agent. It lives in a different compose project and
    # depends_on cannot cross projects. Open WebUI tolerates an unreachable
    # backend at boot, so `restart: unless-stopped` plus the deploy smoke gate
    # covers ordering.
    ports:
      - "${OPENWEBUI_BIND:-0.0.0.0}:3000:8080"
    environment:
      # hermes-agent resolves by container name over poc-net, across projects.
      OPENAI_API_BASE_URL: "http://hermes-agent:8642/v1"
      OPENAI_API_KEY: "${HERMES_API_KEY:?HERMES_API_KEY must be set}"
      # Without this, the two settings above are only *defaults*:
      # `openai.api_base_urls` and `openai.api_keys` are PersistentConfig keys,
      # and Config.get() returns the DB row from the carried-over data volume
      # in preference to the default whenever persistence is on -- so a stale,
      # empty connection row would silently outrank the values set here and
      # chat would stay broken after a recreate. "False" makes this file the
      # single source of truth for the Hermes connection on every boot.
      # Trade-off: Admin -> Settings changes to any config-backed setting no
      # longer survive a restart. Nothing is deleted, the rows are only
      # bypassed, so removing this line restores the previous behaviour and
      # the previously saved values.
      ENABLE_PERSISTENT_CONFIG: "False"
      # ALL SEVEN MUST STAY "false". These are the auto-generation tasks, and
      # `routers/tasks.py` never calls `process_filter_functions` for any of
      # them -- each one builds its prompt straight from the stored chat, which
      # holds the RESTORED, UNMASKED answer. So they reach the task model with
      # real client names and real portfolio figures on a path trc-backend
      # cannot see, cannot filter, and cannot audit. It is the one hole the
      # redaction filter cannot plug.
      #
      # Title and follow-up were "true" here until 2026-08-11, and that was not
      # an oversight -- the other five were deliberately set to "false", so
      # someone worked the list and judged these two harmless. They are not.
      # Measured in the staging logs on that date: a title/follow-up prompt
      # quoting a real client entity with its real portfolio value, and one
      # follow-up prompt carrying the entire 48-name client roster in
      # plaintext, because the preceding turn had been an enumeration.
      #
      # There is no safe subset. The prompt source is the same stored chat for
      # every task in this list; "title" only sounds innocuous. Pointing
      # TASK_MODEL at an in-boundary model would be the alternative fix, but
      # Hermes is not one for this purpose -- it relays to an external
      # reasoning model, so the text still leaves.
      #
      # Cost of "false", accepted deliberately: chats no longer auto-title
      # (they fall back to the first message) and no follow-up chips are
      # suggested. A UX regression is the correct trade against sending a
      # client list to a third party.
      #
      # trc-backend warns at boot when any of these is on --
      # app/core/owui_task_guard.py reads GET /api/v1/tasks/config. It is a
      # smoke alarm, not a fix: this file is the fix, and with
      # ENABLE_PERSISTENT_CONFIG false it is authoritative on every boot.
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_IMAGE_PROMPT_GENERATION: "false"
      WEBUI_AUTH: "true"
      # API keys (sk-...). Enable them so an admin can mint the key trc-backend's
      # integrations authenticate with (OPENWEBUI_ADMIN_KEY): the retention
      # sweep's `get_chats`, the customer/user sync, and the chat-deletion hooks
      # all call Open WebUI's admin API with it, and every one 403s while this is
      # off. The var is PLURAL and defaults to False; the singular ENABLE_API_KEY
      # is not a setting and configuring it does nothing (a 403 on an otherwise
      # correct request -- the trap the deploy runbook calls out). Open WebUI API
      # keys are STATIC bearer tokens with no expiry, so once this is on the admin
      # key is permanent -- there is no API-key TTL to configure.
      ENABLE_API_KEYS: "true"
      # Session (login) token lifetime -- NOT the API key's, which never expires.
      # Default is 4w; "-1" means never. Set to never (2026-09-02) so operator
      # sessions do not lapse. Open WebUI logs its own SECURITY WARNING for -1: a
      # never-expiring session token cannot be timed out if it leaks, so this is
      # a deliberate staging trade-off. Override with JWT_EXPIRES_IN in the env
      # (e.g. "4w") to restore an expiry.
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:--1}"
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      # Signs X-OpenWebUI-User-Jwt, which Hermes forwards to MCP servers as
      # X-Hermes-End-User-Jwt. trc-backend verifies the signature, so the same
      # value must be configured there as IDENTITY_JWT_SECRET. Nothing on
      # either side detects a mismatch.
      FORWARD_USER_INFO_HEADER_JWT_SECRET: "${OPENWEBUI_JWT_SECRET:?OPENWEBUI_JWT_SECRET must be set}"
      # Lifetime of that forwarded JWT. It is minted ONCE per turn and reused for
      # every MCP tool call within it, so its TTL must exceed the longest possible
      # turn. Open WebUI's default is 300s (5 min) -- shorter than a real
      # RAG-agent turn (several ~20-30s `query` calls plus retries), so the token
      # expired mid-turn and trc-backend rejected the later calls with
      # "no verified caller identity (fail-closed)", reason=expired (observed live
      # 2026-09-02). 24h is generous and safe for an internal trust-boundary
      # token; overridable, but never leave it at the 300s default for this
      # workload. trc-backend's verifier correctly rejects an expired token, so
      # the fix belongs here (issuance), not there.
      FORWARD_USER_INFO_HEADER_JWT_EXPIRES_SECONDS: "${FORWARD_USER_INFO_HEADER_JWT_EXPIRES_SECONDS:-86400}"
      # Chat deletion tells trc-backend to purge that chat's PII mappings.
      # Reached over trc-shared by container name, exactly as the redaction
      # filter's own calls are, so it never leaves the trust boundary. Both
      # variables must be set or the hook is a silent no-op -- which is what
      # every staging deploy was until this block existed.
      RAGNAROK_BASE_URL: "${RAGNAROK_BASE_URL:-http://app:8000}"
      # Secret. TWO-REPO SECRET: the SAME value trc-backend calls
      # REDACTION_SERVICE_KEY -- the service-realm bearer gating
      # /api/redaction/*, the forget endpoints included. A mismatch is silent
      # by design (the hook swallows the 401 rather than failing a deletion)
      # and surfaces only as mappings outliving their chat until trc-backend's
      # reconciling sweep collects them. `:?` and not a default on purpose: an
      # unset secret must fail the deploy loudly rather than quietly turn the
      # purge back off.
      RAGNAROK_SERVICE_KEY: "${RAGNAROK_SERVICE_KEY:?RAGNAROK_SERVICE_KEY must be set}"
    volumes:
      - trc-staging-open-webui-data:/app/backend/data
